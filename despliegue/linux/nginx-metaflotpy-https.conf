# Nginx para MetaFlotPy — HTTPS con certificados propios
#
# Usa este archivo SOLO si ya tienes el certificado y la clave en el servidor
# (por ejemplo, emitidos por tu institución). Si vas a usar Let's Encrypt,
# instala nginx-metaflotpy.conf y ejecuta certbot: él genera este bloque solo.
#
#   sudo cp nginx-metaflotpy-https.conf /etc/nginx/sites-available/metaflotpy
#   sudo ln -s /etc/nginx/sites-available/metaflotpy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream metaflotpy {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# --- HTTP: solo validación de certificado y redirección a HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name metaflotpy.ejemplo.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                     # en Nginx < 1.25 usa:  listen 443 ssl http2;
    server_name metaflotpy.ejemplo.pe;

    ssl_certificate     /etc/ssl/metaflotpy/fullchain.pem;
    ssl_certificate_key /etc/ssl/metaflotpy/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    access_log /var/log/nginx/metaflotpy.access.log;
    error_log  /var/log/nginx/metaflotpy.error.log;

    location /static/ {
        alias /opt/metaflotpy/app/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /salud {
        proxy_pass http://metaflotpy;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://metaflotpy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
    }
}
