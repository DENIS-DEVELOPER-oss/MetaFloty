# Nginx para MetaFlotPy en Windows
#
#   Copia este archivo a  C:\nginx\conf\conf.d\metaflotpy.conf
#   e inclúyelo desde nginx.conf con:   include conf.d/*.conf;
#
#   nginx -t          (comprobar)
#   nginx -s reload   (recargar)
#
# Ajusta el dominio y las rutas de los certificados.

upstream metaflotpy {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    server_name metaflotpy.ejemplo.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                     # en Nginx < 1.25 usa:  listen 443 ssl http2;
    server_name metaflotpy.ejemplo.pe;

    ssl_certificate     C:/certificados/metaflotpy/fullchain.pem;
    ssl_certificate_key C:/certificados/metaflotpy/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Archivos estáticos servidos por Nginx.
    # Las plantillas añaden ?v=<version>, así que se pueden cachear a fondo.
    location /static/ {
        alias C:/MetaFlotPy/app/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /salud {
        proxy_pass http://metaflotpy;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://metaflotpy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
}
